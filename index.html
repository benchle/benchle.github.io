<!DOCTYPE html>  
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Benchle</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="icon" type="image/x-icon" href="faviconreviews.ico">
<style>
* { 
  box-sizing: border-box; 
  margin: 0; 
  padding: 0; 
}

:root {
  /* System Colors aus dem 2. CSS */
  --win-gray: #c0c0c0;
  --win-dark: #808080;
  --win-black: #000000;
  --win-light: #ffffff;
  --win-blue: #000080;
  --neon-yellow: #ffff00;
  --hyper-link: #0000ff;

  /* Anpassung der Variablen aus dem 1. CSS auf Win95 Style */
  --bg: #008080; /* Klassisches Windows 95 Teal */
  --white: var(--win-gray);
  --border: var(--win-dark);
  --text: var(--win-black);
  --text-secondary: #404040;
  --star: #ff0000; /* Retro-Rot für Akzente */
  --star-empty: #808080;
  --blue: var(--win-blue);
  --blue-hover: #0000a0;
  --tag-sel-bg: var(--win-blue);
  --tag-sel-color: var(--win-light);
  --green: #008000;
  --radius: 0px; /* Windows 95 ist eckig! */
}

/* 3D Border Mixins */
.win-border-outset {
  background-color: var(--win-gray);
  border-top: 2px solid var(--win-light);
  border-left: 2px solid var(--win-light);
  border-right: 2px solid var(--win-dark);
  border-bottom: 2px solid var(--win-dark);
}

.win-border-inset {
  background-color: var(--win-light);
  border-top: 2px solid var(--win-dark);
  border-left: 2px solid var(--win-dark);
  border-right: 2px solid var(--win-light);
  border-bottom: 2px solid var(--win-light);
}

body { 
  font-family: "MS Sans Serif", "Arial", sans-serif; 
  background-color: var(--bg); 
  color: var(--text); 
  min-height: 100vh;
  
  /* Flexbox aktivieren, damit sich der Footer unten ausrichtet */
  display: flex;
  flex-direction: column;
}

/* Header als Windows-Fenster/Leiste */
header { 
  background: var(--win-gray); 
  border-top: 2px solid var(--win-light);
  border-left: 2px solid var(--win-light);
  border-right: 2px solid var(--win-dark);
  border-bottom: 2px solid var(--win-dark);
  position: sticky; 
  top: 0; 
  z-index: 100; 
}

.header-inner { 
  max-width: 900px; 
  margin: 0 auto; 
  padding: 8px 12px; 
  display: flex; 
  align-items: center; 
  justify-content: space-between; 
  gap: 12px; 
}

.logo-text { 
  font-size: 18px; 
  font-weight: bold; 
  color: var(--win-black); 
  background: var(--win-blue);
  color: var(--win-light);
  padding: 3px 8px;
}

.logo-text span { 
  color: var(--neon-yellow); 
}

/* Win95 Retro Button */
.btn-write, .btn-submit, .retro-btn { 
  display: flex; 
  align-items: center; 
  gap: 7px; 
  padding: 4px 12px; 
  background: var(--win-gray); 
  color: var(--win-black); 
  border-top: 2px solid var(--win-light);
  border-left: 2px solid var(--win-light);
  border-right: 2px solid var(--win-dark);
  border-bottom: 2px solid var(--win-dark);
  border-radius: 0; 
  font-family: "MS Sans Serif", "Arial", sans-serif; 
  font-size: 12px; 
  font-weight: bold; 
  cursor: pointer; 
  white-space: nowrap; 
}

.btn-write:hover, .btn-submit:not(:disabled):hover { 
  background: #d4d4d4; 
}

.btn-write:active, .btn-submit:not(:disabled):active { 
  border-top: 2px solid var(--win-dark);
  border-left: 2px solid var(--win-dark);
  border-right: 2px solid var(--win-light);
  border-bottom: 2px solid var(--win-light);
  padding: 5px 11px 3px 13px;
}

main { 
  max-width: 900px; 
  margin: 0 auto; 
  padding: 20px; 
  width: 100%;
  
  /* Das drückt den Footer nach ganz unten, wenn wenig Inhalt da ist */
  flex: 1; 
}

/* Hero Box als 3D Container */
.hero { 
  background: var(--win-gray); 
  border-top: 2px solid var(--win-light);
  border-left: 2px solid var(--win-light);
  border-right: 2px solid var(--win-dark);
  border-bottom: 2px solid var(--win-dark);
  padding: 16px; 
  margin-bottom: 20px; 
  display: flex; 
  align-items: center; 
  gap: 24px; 
}

.hero-score { 
  text-align: center; 
  flex-shrink: 0; 
  background: var(--win-light);
  border-top: 2px solid var(--win-dark);
  border-left: 2px solid var(--win-dark);
  border-right: 2px solid var(--win-light);
  border-bottom: 2px solid var(--win-light);
  padding: 10px;
}

.hero-num { 
  font-size: 42px; 
  font-weight: bold; 
  line-height: 1; 
  font-family: "Courier New", monospace;
}

.hero-stars { 
  display: flex; 
  gap: 3px; 
  margin: 6px 0 4px; 
  justify-content: center; 
}

.hero-count { 
  font-size: 11px; 
  color: var(--text-secondary); 
}

.hero-divider { 
  width: 2px; 
  height: 80px; 
  border-left: 1px solid var(--win-dark);
  border-right: 1px solid var(--win-light);
  flex-shrink: 0; 
}

.hero-bars { 
  flex: 1; 
  display: flex; 
  flex-direction: column; 
  gap: 6px; 
}

.bar-row { 
  display: flex; 
  align-items: center; 
  gap: 10px; 
}

.bar-label { 
  font-size: 12px; 
  color: var(--win-black); 
  width: 16px; 
  text-align: right; 
  flex-shrink: 0; 
  font-weight: bold;
}

.bar-track { 
  flex: 1; 
  height: 12px; 
  background: var(--win-light); 
  border-top: 1px solid var(--win-dark);
  border-left: 1px solid var(--win-dark);
  border-right: 1px solid var(--win-light);
  border-bottom: 1px solid var(--win-light);
}

.bar-fill { 
  height: 100%; 
  background: var(--win-blue); 
}

.bar-count { 
  font-size: 12px; 
  color: var(--win-black); 
  width: 24px; 
  flex-shrink: 0; 
  font-family: "Courier New", monospace;
}

.toolbar { 
  display: flex; 
  align-items: center; 
  justify-content: space-between; 
  margin-bottom: 16px; 
  flex-wrap: wrap; 
  gap: 10px; 
}

.toolbar-label { 
  font-size: 12px; 
  color: var(--win-light); 
  font-weight: bold;
}

.sort-select { 
  padding: 3px 6px; 
  border-top: 2px solid var(--win-dark);
  border-left: 2px solid var(--win-dark);
  border-right: 2px solid var(--win-light);
  border-bottom: 2px solid var(--win-light);
  background: var(--win-light); 
  font-family: "MS Sans Serif", "Arial", sans-serif; 
  font-size: 12px; 
  color: var(--win-black); 
  outline: none; 
}

/* Review Cards als Windows-Fenster */
.review-card { 
  background: var(--win-gray); 
  border-top: 2px solid var(--win-light);
  border-left: 2px solid var(--win-light);
  border-right: 2px solid var(--win-dark);
  border-bottom: 2px solid var(--win-dark);
  padding: 8px; 
  cursor: pointer; 
  margin-bottom: 16px; 
}

.rc-top { 
  display: flex; 
  align-items: stretch; 
  justify-content: space-between; 
  gap: 12px; 
  margin-bottom: 8px; 
  background: var(--win-blue);
  color: var(--win-light);
  padding: 4px 6px;
}

.rc-meta { 
  flex: 1; 
  min-width: 0; 
}

.rc-location { 
  font-size: 13px; 
  font-weight: bold; 
  white-space: nowrap; 
  overflow: hidden; 
  text-overflow: ellipsis; 
}

.rc-stars-row { 
  display: flex; 
  align-items: center; 
  gap: 6px; 
}

.rc-date { 
  font-size: 11px; 
  color: #c0c0c0; 
}

.rc-score { 
  text-align: center; 
  flex-shrink: 0; 
  background: var(--win-black); 
  color: var(--neon-yellow);
  border: 1px solid var(--neon-yellow);
  padding: 2px 8px; 
}

.rc-score-num { 
  font-size: 18px; 
  font-weight: bold; 
  font-family: "Courier New", monospace;
}

.rc-score-label { 
  font-size: 9px; 
  text-transform: uppercase;
}

.rc-sub-stars { 
  display: flex; 
  gap: 16px; 
  margin: 8px 0; 
  flex-wrap: wrap; 
}

.rc-sub { 
  font-size: 12px; 
  color: var(--win-black); 
  display: flex; 
  align-items: center; 
  gap: 4px; 
}

.rc-sub b { 
  color: #ff0000; 
}

.rc-tags { 
  display: flex; 
  flex-wrap: wrap; 
  gap: 6px; 
  margin-bottom: 8px; 
}

.rc-tag { 
  padding: 2px 6px; 
  background: var(--win-black); 
  color: var(--neon-yellow); 
  border: 1px solid var(--neon-yellow); 
  font-size: 11px; 
  font-weight: bold; 
  font-family: "Courier New", monospace;
}

.rc-desc { 
  font-size: 13px; 
  color: var(--win-black); 
  line-height: 1.4; 
  background: var(--win-light);
  border-top: 2px solid var(--win-dark);
  border-left: 2px solid var(--win-dark);
  border-right: 2px solid var(--win-light);
  border-bottom: 2px solid var(--win-light);
  padding: 8px;
}

/* Modal Dialog (Windows Pop-Up) */
.modal-overlay { 
  display: none; 
  position: fixed; 
  inset: 0; 
  background: rgba(0,0,0,0.4); 
  z-index: 200; 
  align-items: center; 
  justify-content: center; 
  padding: 20px; 
}

.modal-overlay.open { 
  display: flex; 
}

.modal { 
  background: var(--win-gray); 
  border-top: 2px solid var(--win-light);
  border-left: 2px solid var(--win-light);
  border-right: 2px solid var(--win-dark);
  border-bottom: 2px solid var(--win-dark);
  width: 100%; 
  max-width: 560px; 
  max-height: 90vh; 
  overflow-y: auto; 
  padding: 3px;
}

.modal-header { 
  display: flex; 
  align-items: center; 
  justify-content: space-between; 
  padding: 3px 6px; 
  background: var(--win-blue); 
  color: var(--win-light);
}

.modal-header h2 { 
  font-size: 13px; 
  font-weight: bold; 
}

.modal-close { 
  width: 16px; 
  height: 14px; 
  border-top: 1px solid var(--win-light);
  border-left: 1px solid var(--win-light);
  border-right: 1px solid var(--win-dark);
  border-bottom: 1px solid var(--win-dark);
  background: var(--win-gray); 
  font-size: 10px; 
  font-weight: bold;
  cursor: pointer; 
  display: flex; 
  align-items: center; 
  justify-content: center; 
  color: var(--win-black); 
  line-height: 1;
}

.modal-body { 
  padding: 12px; 
}

.field { 
  margin-bottom: 16px; 
}

.field label { 
  display: block; 
  font-size: 12px; 
  font-weight: bold; 
  color: var(--win-black); 
  margin-bottom: 4px; 
}

.field input[type="text"], .field textarea, .bbs-input { 
  width: 100%; 
  padding: 4px; 
  border-top: 2px solid var(--win-dark);
  border-left: 2px solid var(--win-dark);
  border-right: 2px solid var(--win-light);
  border-bottom: 2px solid var(--win-light);
  font-family: "Courier New", monospace; 
  font-size: 13px; 
  color: var(--win-black); 
  outline: none; 
  background: var(--win-light); 
}

.stars-grid { 
  display: grid; 
  grid-template-columns: 1fr 1fr 1fr; 
  gap: 12px; 
  margin-bottom: 16px; 
}

.star-group-label { 
  font-size: 11px; 
  font-weight: bold; 
  color: var(--win-black); 
  margin-bottom: 4px; 
}

.stars { 
  display: flex; 
  gap: 2px; 
}

.star { 
  font-size: 20px; 
  color: var(--win-dark); 
  cursor: pointer; 
  user-select: none; 
}

.star.lit { 
  color: #ff0000; 
}

.tags-wrap { 
  display: flex; 
  flex-wrap: wrap; 
  gap: 6px; 
}

.tag { 
  padding: 2px 8px; 
  border-top: 2px solid var(--win-light);
  border-left: 2px solid var(--win-light);
  border-right: 2px solid var(--win-dark);
  border-bottom: 2px solid var(--win-dark);
  background: var(--win-gray); 
  color: var(--win-black); 
  font-family: "MS Sans Serif", "Arial", sans-serif; 
  font-size: 12px; 
  font-weight: bold; 
  cursor: pointer; 
}

.tag.selected { 
  background: var(--win-black); 
  color: var(--neon-yellow); 
  border: 1px solid var(--neon-yellow);
}

.modal-footer { 
  display: flex; 
  align-items: center; 
  justify-content: space-between; 
  padding-top: 12px; 
  border-top: 1px dashed var(--win-dark); 
  margin-top: 8px; 
  gap: 10px; 
}

.btn-submit:disabled { 
  opacity: 0.6; 
  color: var(--win-dark);
  cursor: not-allowed; 
}

/* Detailansicht & Hilfsklassen */
.detail-sub-card, .detail-desc {
  background: var(--win-light);
  border-top: 2px solid var(--win-dark);
  border-left: 2px solid var(--win-dark);
  border-right: 2px solid var(--win-light);
  border-bottom: 2px solid var(--win-light);
}

footer { 
  border-top: 2px solid var(--win-light);
  background: var(--win-gray); 
  padding: 16px; 
  /* margin-top abändern oder entfernen, damit kein riesiger Abstand entsteht */
  margin-top: auto; 
  width: 100%;
}

.footer-inner { 
  max-width: 900px; 
  margin: 0 auto; 
  display: flex; 
  flex-direction: column; 
  align-items: center; 
  gap: 10px; 
  text-align: center; 
}

.footer-links a { 
  font-size: 12px; 
  color: var(--hyper-link); 
  text-decoration: underline; 
}

@media (max-width: 500px) {
  .hero { flex-direction: column; gap: 16px; }
  .hero-divider { display: none; }
  .stars-grid { grid-template-columns: 1fr; }
  .rc-score { display: none; }
}
</style>
</head>

<script>
const BIN_ID  = '69d17eef36566621a87ccb6c';
const API_KEY = '$2a$10$ub/q6IbwSoV/mcYt129Aj.IW5K7ye0Wn/wiUhGXppQZtIIh.BXlI2';

const ANNOYANCES = ['Loud','Pigeons','No shade','Trash everywhere','Shakes','Bad view','Worn down','No backrest','Too cramped','Bad lighting','Too sunny','Wet','Drafty'];

let ratings = { location: 0, view: 0, overall: 0 };
let selectedTags = [];
let cachedReviews = null;
let currentSort = 'newest';

async function loadReviews() {
  if (cachedReviews !== null) return cachedReviews;
  try {
    const res = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, {
      headers: { 'X-Master-Key': API_KEY },
    });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    const rec = data.record;
    cachedReviews = Array.isArray(rec) ? rec
                  : (rec && Array.isArray(rec.reviews)) ? rec.reviews
                  : [];
  } catch(e) {
    console.error('Failed to load:', e);
    cachedReviews = [];
  }
  return cachedReviews;
}

function saveReviews(reviews) {
  cachedReviews = reviews;
  return new Promise((resolve) => {
    const xhr = new XMLHttpRequest();
    xhr.open('PUT', `https://api.jsonbin.io/v3/b/${BIN_ID}`, true);
    xhr.setRequestHeader('X-Master-Key', API_KEY);
    xhr.onload = () => resolve();
    xhr.onerror = () => { console.error('Save failed'); resolve(); };
    xhr.send(new Blob([JSON.stringify({ reviews })], { type: 'application/json' }));
  });
}

function starsHtml(val, size) {
  let h = '';
  for (let i = 1; i <= 5; i++) h += `<span style="font-size:${size||14}px;color:${i<=val?'#fbbc04':'#dadce0'}">★</span>`;
  return h;
}

function renderStarsEl(container, val, key, readonly) {
  container.innerHTML = '';
  for (let i = 1; i <= 5; i++) {
    const s = document.createElement('span');
    s.className = 'star' + (i <= val ? ' lit' : '') + (readonly ? ' readonly' : '');
    s.textContent = '★';
    if (!readonly) {
      s.addEventListener('mouseenter', () => document.querySelectorAll(`#stars-${key} .star`).forEach((x,j) => x.classList.toggle('lit', j < i)));
      s.addEventListener('mouseleave', () => document.querySelectorAll(`#stars-${key} .star`).forEach((x,j) => x.classList.toggle('lit', j < ratings[key])));
      s.addEventListener('click', () => { ratings[key] = i; document.querySelectorAll(`#stars-${key} .star`).forEach((x,j) => x.classList.toggle('lit', j < i)); validateForm(); });
    }
    container.appendChild(s);
  }
}

function renderTagsEl(wrap) {
  wrap.innerHTML = '';
  ANNOYANCES.forEach(tag => {
    const btn = document.createElement('button');
    btn.className = 'tag' + (selectedTags.includes(tag) ? ' selected' : '');
    btn.textContent = tag;
    btn.onclick = () => {
      selectedTags = selectedTags.includes(tag) ? selectedTags.filter(t=>t!==tag) : [...selectedTags, tag];
      renderTagsEl(wrap);
    };
    wrap.appendChild(btn);
  });
}

function validateForm() {
  const btn = document.getElementById('submit-btn');
  if (btn) btn.disabled = !document.getElementById('loc')?.value.trim() || !ratings.overall;
}

function initForm() {
  ratings = { location: 0, view: 0, overall: 0 };
  selectedTags = [];
  document.getElementById('form-inner').innerHTML = `
    <div class="field">
      <label for="loc">Place *</label>
      <input type="text" id="loc" placeholder="e.g. Central Park, near the fountain" oninput="validateForm()" />
    </div>
    <div class="stars-grid">
      <div><div class="star-group-label">Position</div><div class="stars" id="stars-location"></div></div>
      <div><div class="star-group-label">View</div><div class="stars" id="stars-view"></div></div>
      <div><div class="star-group-label">Overall *</div><div class="stars" id="stars-overall"></div></div>
    </div>
    <div class="field">
      <label>Anything annoying?</label>
      <div class="tags-wrap" id="tags-wrap"></div>
    </div>
    <div class="field">
      <label for="desc">Description</label>
      <textarea id="desc" rows="4" placeholder="What makes this bench special?"></textarea>
    </div>
    <div class="modal-footer">
      <span class="anon-note">Anonymous · No account needed</span>
      <button class="btn-submit" id="submit-btn" onclick="submitReview()" disabled>Post</button>
    </div>`;
  renderStarsEl(document.getElementById('stars-location'), 0, 'location', false);
  renderStarsEl(document.getElementById('stars-view'), 0, 'view', false);
  renderStarsEl(document.getElementById('stars-overall'), 0, 'overall', false);
  renderTagsEl(document.getElementById('tags-wrap'));
}

async function submitReview() {
  const loc = document.getElementById('loc').value.trim();
  if (!loc || !ratings.overall) return;
  const btn = document.getElementById('submit-btn');
  btn.disabled = true;
  btn.textContent = 'Saving...';
  const review = {
    id: Date.now(),
    date: new Date().toISOString(),
    location: loc,
    description: document.getElementById('desc').value.trim(),
    starLocation: ratings.location,
    starView: ratings.view,
    starOverall: ratings.overall,
    annoyances: [...selectedTags],
  };
  const reviews = await loadReviews();
  reviews.unshift(review);
  await saveReviews(reviews);
  document.getElementById('form-inner').innerHTML = `<div class="success-msg"><div class="check"></div><p>Review posted!</p></div>`;
  setTimeout(() => { closeWriteModal(); cachedReviews = null; renderList(); }, 1600);
}

function openWriteModal() { initForm(); document.getElementById('write-modal').classList.add('open'); document.body.style.overflow = 'hidden'; }
function closeWriteModal() { document.getElementById('write-modal').classList.remove('open'); document.body.style.overflow = ''; }
function closeDetailModal() { document.getElementById('detail-modal').classList.remove('open'); document.body.style.overflow = ''; }
function closeIfOutside(e, id) { if (e.target.id === id) { document.getElementById(id).classList.remove('open'); document.body.style.overflow = ''; } }

function sortReviews(val) { currentSort = val; renderList(); }

async function renderList() {
  const container = document.getElementById('reviews-container');
  container.innerHTML = '<div class="loading"><div class="spinner"></div> Loading Reviews…</div>';
  document.getElementById('hero').style.display = 'none';
  document.getElementById('toolbar').style.display = 'none';

  let reviews = await loadReviews();
  reviews = [...reviews];
  if (currentSort === 'best') reviews.sort((a,b) => b.starOverall - a.starOverall);
  else if (currentSort === 'worst') reviews.sort((a,b) => a.starOverall - b.starOverall);

  container.innerHTML = '';

  if (reviews.length === 0) {
    container.innerHTML = `<div class="empty-state"><div class="icon"></div><h3>No reviews yet</h3><p>Be the first to review a bench!</p></div>`;
    return;
  }

  const avg = reviews.reduce((a,r)=>a+r.starOverall,0)/reviews.length;
  const counts = [5,4,3,2,1].map(n => reviews.filter(r=>r.starOverall===n).length);
  document.getElementById('hero-num').textContent = avg.toFixed(1);
  document.getElementById('hero-stars').innerHTML = starsHtml(Math.round(avg), 22);
  document.getElementById('hero-count').textContent = reviews.length + (reviews.length===1?' Review':' Reviews');
  document.getElementById('hero-bars').innerHTML = [5,4,3,2,1].map((n,i) => `
    <div class="bar-row">
      <div class="bar-label">${n}</div>
      <div class="bar-track"><div class="bar-fill" style="width:${reviews.length?counts[i]/reviews.length*100:0}%"></div></div>
      <div class="bar-count">${counts[i]}</div>
    </div>`).join('');
  document.getElementById('hero').style.display = 'flex';
  document.getElementById('toolbar-label').textContent = reviews.length + (reviews.length===1?' Review':' Reviews');
  document.getElementById('toolbar').style.display = 'flex';

  reviews.forEach(r => {
    const card = document.createElement('div');
    card.className = 'review-card anim';
    card.onclick = () => showDetail(r.id);
    const tags = r.annoyances?.length
      ? r.annoyances.slice(0,3).map(t=>`<span class="rc-tag">${esc(t)}</span>`).join('') + (r.annoyances.length>3?`<span class="rc-tag">+${r.annoyances.length-3}</span>`:'')
      : '';
    const subStars = [
      r.starLocation ? `<div class="rc-sub">Position <b>${'★'.repeat(r.starLocation)}</b></div>` : '',
      r.starView     ? `<div class="rc-sub">View <b>${'★'.repeat(r.starView)}</b></div>` : '',
    ].join('');
    card.innerHTML = `
      <div class="rc-top">
        <div class="rc-meta">
          <div class="rc-location">${esc(r.location)}</div>
          <div class="rc-stars-row">
            ${starsHtml(r.starOverall,14)}
            <span class="rc-date">${formatDate(r.date)}</span>
          </div>
        </div>
        <div class="rc-score"><div class="rc-score-num">${r.starOverall}</div><div class="rc-score-label">/ 5</div></div>
      </div>
      ${subStars ? `<div class="rc-sub-stars">${subStars}</div>` : ''}
      ${tags ? `<div class="rc-tags">${tags}</div>` : ''}
      ${r.description ? `<div class="rc-desc">${esc(r.description)}</div>` : ''}`;
    container.appendChild(card);
  });
}

async function showDetail(id) {
  const reviews = await loadReviews();
  const r = reviews.find(x => x.id === id);
  if (!r) return;
  document.getElementById('detail-content').innerHTML = `
    <div class="detail-loc">${esc(r.location)}</div>
    <div class="detail-score-row">
      <div class="detail-score-big">${r.starOverall}</div>
      <div class="detail-score-right">
        <div>${starsHtml(r.starOverall, 20)}</div>
        <div class="detail-date">${formatDate(r.date)}</div>
      </div>
    </div>
    ${(r.starLocation || r.starView) ? `
    <div class="detail-sub-grid">
      ${r.starLocation ? `<div class="detail-sub-card"><div class="detail-sub-card-label">Position</div>${starsHtml(r.starLocation,18)}</div>` : ''}
      ${r.starView ? `<div class="detail-sub-card"><div class="detail-sub-card-label">View</div>${starsHtml(r.starView,18)}</div>` : ''}
    </div>` : ''}
    ${r.annoyances?.length ? `<div class="detail-tags">${r.annoyances.map(t=>`<span class="detail-tag">${esc(t)}</span>`).join('')}</div>` : ''}
    ${r.description ? `<div class="detail-desc">${esc(r.description)}</div>` : ''}`;
  document.getElementById('detail-modal').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function esc(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function formatDate(iso) { return new Date(iso).toLocaleDateString('en-GB',{day:'2-digit',month:'long',year:'numeric'}); }

renderList();
</script>
</body>
</html>
